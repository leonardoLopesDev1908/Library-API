services:
  db:
    image: postgres:16-alpine
    container_name: library_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    shm_size: 128mb

#Implementing types of data bases
  mongo:
    image: mongo:latest
    container_name: mongodb_container
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=admin
      - MONGO_INITDB_ROOT_PASSWORD=809117Aa*
    volumes:
      - mongo_data:/data/db

  redis-cache:
    image: redis:7.4-alpine
    container_name: redis_cache
    restart: always
    ports:
      - "6379:6379"
    command: redis-server --requirepass MySecurePassword123 --save 60 1
    volumes:
      - redis_data:/data

volumes:
  mongo_data:
    driver: local
  postgres_data:
  redis_data:
