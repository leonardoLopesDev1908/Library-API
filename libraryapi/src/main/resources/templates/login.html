<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8">
        <meta name = "viewport" content="width=device-width, initial-scale=1">
        <title>Login - Sistema</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
        <style>
            body{
                background: linear-gradient(to right, #0f2027, #203a43, #2c5364);
                height: 100vh;
                display: flex;
                align-items: center;
                justify-content: center;
            }

            .card{
                border: none;
                border-radius: 15px;
                box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            }

            .btn-primary {
                background-color: #203a43;
                border: none;
            }

            .btn-primary:hover{
                background-color: #2c5364;
            }

            .form-control:focus {
                border-color: #2c5364;
                box-shadow: 0 0 0 0.2rem rgba(44, 83, 100, 0.25);
            }
        </style>
    </head>
        <body>
            <div class="card p-4" style="width: 100%; max-width: 400px;">
                <h2 class="text-center mb-4">Acesso ao Sistema</h2>
                <form method="post" th:action="@{/login}">
                    <div class="mb-3">
                        <label for="username" class="form-label">Usuário</label>
                        <input type="text" class="form-control" id="username" name="username" placeholder="Digite seu nome de usuário" required>
                    </div>

                    <div class="mb-3">
                        <label for="password" class="form-label">Senha</label>
                        <input type="password" class="form-control" id="password" name="password" placeholder="********" required>
                    </div>

                    <div class="d-grid">
                        <button type="submit" class="btn btn-primary">Entrar</button>
                    </div>
                </form>
                <br/>
                <hr>
                <a th:href="@{/oauth2/authorization/google}" class="btn btn-primary w-100">Entrar com Google</a>
            </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    </body>
</html>
