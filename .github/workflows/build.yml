name: library_ci
on: push
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - run: pwd
      - run: ls -la
      - run: echo "Building..."
      - run: mvn validate
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: mvn validate
  test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: mvn clean test
  verify:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - run: echo "Verifying..."
      - run: mvn verify